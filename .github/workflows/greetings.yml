name: greetings
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome and thanks for opening this issue! A maintainer will take a look soon. ⭐"
          pr-message: "Thanks for your PR! It will be reviewed shortly — welcome aboard. 🎉"
