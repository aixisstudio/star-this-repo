name: Star Back
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  star:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Star back new stargazers
        env: {PAT: ${{ secrets.PAT }}}
        run: |
          python3 - <<'PY'
          import requests, pathlib
          import os
          s = requests.Session(); s.headers.update({"Authorization": "token "+os.environ["PAT"], "Accept": "application/vnd.github+json"})
          st = s.get("https://api.github.com/repos/aixisstudio/star-this-repo/stargazers?per_page=100").json()
          done = set(pathlib.Path("stargazed.txt").read_text().split()) if pathlib.Path("stargazed.txt").exists() else set()
          new = [u["login"] for u in st if isinstance(u,dict) and u["login"] not in done][:15]
          n = 0
          for u in new:
              repos = s.get(f"https://api.github.com/users/{u}/repos?per_page=100&sort=pushed").json()
              cands = [r for r in repos if isinstance(r,dict) and not r["fork"]]
              if cands:
                  best = max(cands, key=lambda r: r["stargazers_count"])
                  s.put(f"https://api.github.com/user/starred/{best['full_name']}")
                  n += 1
              done.add(u)
          pathlib.Path("stargazed.txt").write_text("\n".join(sorted(done)))
          print(f"starred back {n} users' repos")
          PY
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stargazed.txt
          git diff --cached --quiet || git commit -m "chore: star-back state"
          git push
